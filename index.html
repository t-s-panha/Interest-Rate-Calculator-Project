<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple interest calculator for personal finance.">
    <title>Simple Interest Calculator</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Interest Rate Calculator</h1>

        <div class="input-group">
            <label for="principal">Amount</label>
            <input type="number" id="principal" placeholder="Enter principal amount">
        </div>

        <div class="input-group">
            <label for="rate">Rate (%)</label>
            <input type="number" id="rate" placeholder="Enter annual interest rate">
        </div>

        <div class="input-group">
            <label for="years">No. of Years</label>
            <input type="number" id="years" placeholder="Enter number of years">
        </div>

        <div class="result-area">
            <p>Interest: <span id="result">0.00</span></p>
        </div>

        <button id="compute-btn" onclick="compute()">Compute</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
